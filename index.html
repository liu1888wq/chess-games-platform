<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棋类游戏平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        
        .lang-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            max-height: 65vh;
            overflow-y: auto;
            padding: 5px;
        }
        .lang-item {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-item:hover { background: rgba(255,255,255,0.2); }
        .lang-item.selected { background: #e94560; }
        .lang-flag { font-size: 28px; margin-bottom: 4px; }
        .lang-name { font-size: 11px; }
        
        .search-box {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .search-box::placeholder { color: rgba(255,255,255,0.5); }
        
        .btn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn:disabled { opacity: 0.5; }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #888;
            cursor: pointer;
            font-size: 11px;
        }
        .nav-item.active { color: #e94560; }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .game-card {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px 8px;
            text-align: center;
            cursor: pointer;
        }
        .game-icon { font-size: 36px; margin-bottom: 8px; }
        .game-name { font-size: 12px; }
        
        .rank-top3 {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }
        .rank-item {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            width: 90px;
        }
        .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); transform: translateY(-10px); }
        .rank-2 { background: linear-gradient(135deg, #C0C0C0, #E8E8E8); }
        .rank-3 { background: linear-gradient(135deg, #CD7F32, #D4A574); }
        .rank-list {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            max-height: 45vh;
            overflow-y: auto;
        }
        .rank-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<!-- 语言选择 -->
<div id="page-lang" class="page active">
    <h2 style="text-align:center;margin-bottom:15px;">🌍 <span data-i18n="selectLang">选择语言</span></h2>
    <input type="text" class="search-box" id="lang-search" placeholder="搜索语言..." oninput="filterLangs()">
    <div class="lang-grid" id="lang-grid"></div>
    <button class="btn" id="lang-confirm" onclick="confirmLang()" disabled data-i18n="confirm">确认</button>
</div>

<!-- 首页 -->
<div id="page-home" class="page">
    <h2 style="text-align:center;margin-bottom:20px;" data-i18n="title">棋类游戏平台</h2>
    <div class="game-grid">
        <div class="game-card" onclick="alert('五子棋')">
            <div class="game-icon">⚫</div>
            <div class="game-name" data-i18n="gomoku">五子棋</div>
        </div>
        <div class="game-card" onclick="alert('围棋')">
            <div class="game-icon">⚫</div>
            <div class="game-name" data-i18n="go">围棋</div>
        </div>
        <div class="game-card" onclick="alert('中国象棋')">
            <div class="game-icon">🀄</div>
            <div class="game-name" data-i18n="chineseChess">中国象棋</div>
        </div>
    </div>
</div>

<!-- 排行榜 -->
<div id="page-rank" class="page">
    <h2 style="text-align:center;margin-bottom:20px;">🏆 <span data-i18n="leaderboard">排行榜</span> TOP 1000</h2>
    <div class="rank-top3">
        <div class="rank-item rank-2">
            <div style="font-size:28px;">🥈</div>
            <div style="font-weight:bold;font-size:13px;">Gibel</div>
            <div style="font-size:10px;">99.6%</div>
        </div>
        <div class="rank-item rank-1">
            <div style="font-size:36px;">👑</div>
            <div style="font-weight:bold;font-size:16px;">liu</div>
            <div style="font-size:11px;">99.8%</div>
        </div>
        <div class="rank-item rank-3">
            <div style="font-size:28px;">🥉</div>
            <div style="font-weight:bold;font-size:13px;">Phoenix</div>
            <div style="font-size:10px;">98.5%</div>
        </div>
    </div>
    <div class="rank-list" id="rank-list"></div>
</div>

<!-- 我的 -->
<div id="page-profile" class="page">
    <h2 style="text-align:center;margin-bottom:20px;" data-i18n="profile">我的</h2>
    <div style="text-align:center;padding:40px;background:rgba(255,255,255,0.05);border-radius:15px;">
        <div style="font-size:60px;margin-bottom:15px;">👤</div>
        <div style="font-size:18px;" data-i18n="guest">游客</div>
    </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav" id="bottom-nav" style="display:none;">
    <div class="nav-item active" onclick="switchTab('home')">
        <div style="font-size:22px;">🏠</div>
        <div data-i18n="home">首页</div>
    </div>
    <div class="nav-item" onclick="switchTab('rank')">
        <div style="font-size:22px;">🏆</div>
        <div data-i18n="rank">排行</div>
    </div>
    <div class="nav-item" onclick="switchTab('profile')">
        <div style="font-size:22px;">👤</div>
        <div data-i18n="profile">我的</div>
    </div>
</div>
