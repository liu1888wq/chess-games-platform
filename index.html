*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh}
.page{display:none;min-height:100vh}.page.active{display:block}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:7px;padding:12px;max-height:62vh;overflow-y:auto}

.lf{font-size:26px;margin-bottom:3px}.ln{font-size:10px}
.sb{width:calc(100% - 24px);margin:12px;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:14px}

.bn{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.9);display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid rgba(255,255,255,.1);z-index:100}
.ni{text-align:center;color:#888;cursor:pointer;font-size:11px}.ni.a{color:#e94560}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
.gc{background:rgba(255,255,255,.1);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer}
.gi{font-size:34px;margin-bottom:6px}
.rt{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:18px 12px}
.ri{text-align:center;padding:12px;border-radius:12px;width:85px}
.r1{background:linear-gradient(135deg,#FFD700,#FFA500);transform:translateY(-10px)}
.r2{background:linear-gradient(135deg,#C0C0C0,#E8E8E8)}
.r3{background:linear-gradient(135deg,#CD7F32,#D4A574)}
.rl{background:rgba(255,255,255,.05);border-radius:12px;margin:0 12px;max-height:45vh;overflow-y:auto}
.rr{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
</style>
